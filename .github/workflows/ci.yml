name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fluxopro
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fluxopro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxopro -d fluxopro_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # Values below exist only for this CI run, against a throwaway database.
    env:
      DB_URL: jdbc:postgresql://localhost:5432/fluxopro_ci
      POSTGRES_DB: fluxopro_ci
      POSTGRES_USER: fluxopro
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-jwt-secret-with-more-than-32-bytes-for-hs256
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fluxopro-backend .
      - name: Build frontend image
        run: docker build -t fluxopro-frontend ./frontend
