spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fluxopro
  datasource:
    url: jdbc:postgresql://localhost:5434/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-migration-naming: true

server:
  port: 8082