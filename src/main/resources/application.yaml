spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fluxopro
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/${POSTGRES_DB}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${PORT:8082}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  alerts:
    cron: "0 0 8 * * *"