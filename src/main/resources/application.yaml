spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fluxopro
  datasource:
    url: jdbc:postgresql://localhost:5434/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-migration-naming: true

server:
  port: 8082

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  alerts:
    cron: "0 0 8 * * *"
    stalled-after-days: 7