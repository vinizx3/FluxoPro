<div class="pw">
  <input
    [id]="fieldId()"
    [type]="visible() ? 'text' : 'password'"
    [attr.autocomplete]="autocompleteHint()"
    [attr.placeholder]="placeholder() || null"
    [attr.maxlength]="maxLength()"
    [class.invalid]="invalid()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="touched()"
  />
  <button
    type="button"
    class="toggle"
    [attr.aria-pressed]="visible()"
    [attr.aria-controls]="fieldId()"
    (click)="toggle()"
  >
    {{ visible() ? 'Ocultar' : 'Mostrar' }}
    <span class="sr-only"> senha</span>
  </button>
</div>
