# Production-like stack: database + backend + frontend (Nginx).
# Run: docker compose -f docker-compose.prod.yml up --build -d
# Secrets come from the .env file next to this file (never committed).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - fluxopro-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  fluxopro-prod-data:
